# ===================================================
# Simulation Data Generator Configuration
# ===================================================

# Core simulation settings
simulation.enabled=true
simulation.batch-size=100
simulation.continuous-enabled=true
simulation.continuous-interval-ms=1000

# Data retention (in days)
simulation.retention-days=90

# Generation rates
simulation.rates.flights-per-hour=20
simulation.rates.vehicles-per-batch=50
simulation.rates.turnarounds-per-hour=15
simulation.rates.dispatches-per-hour=75

# VIDP (Delhi) tenant configuration
simulation.tenants.VIDP.name=Indira Gandhi International Airport
simulation.tenants.VIDP.timezone=Asia/Kolkata
simulation.tenants.VIDP.center-latitude=28.5665
simulation.tenants.VIDP.center-longitude=77.1031
simulation.tenants.VIDP.flights-per-hour=25
simulation.tenants.VIDP.ground-vehicle-count=150

# YBBN (Brisbane) tenant configuration
simulation.tenants.YBBN.name=Brisbane Airport
simulation.tenants.YBBN.timezone=Australia/Brisbane
simulation.tenants.YBBN.center-latitude=-27.3942
simulation.tenants.YBBN.center-longitude=153.1218
simulation.tenants.YBBN.flights-per-hour=18
simulation.tenants.YBBN.ground-vehicle-count=100

# Fleet configuration (number of vehicles per type)
simulation.fleet.fuel-trucks=8
simulation.fleet.catering-trucks=6
simulation.fleet.baggage-tugs=15
simulation.fleet.baggage-carts=40
simulation.fleet.belt-loaders=10
simulation.fleet.gpus=12
simulation.fleet.pushback-tractors=10
simulation.fleet.stairs=8
simulation.fleet.water-trucks=4
simulation.fleet.lavatory-trucks=4
simulation.fleet.deicing-trucks=4
simulation.fleet.asus=6
simulation.fleet.buses=12
simulation.fleet.cargo-loaders=8
simulation.fleet.ambulifts=2

# Alert configuration
simulation.alerts.delay-threshold-minutes=5
simulation.alerts.deduplication-window-minutes=30
simulation.alerts.auto-resolve-after-hours=24

# Financial configuration
simulation.financial.delay-cost-per-minute=125
simulation.financial.sla-penalty-rate=500
simulation.financial.base-operational-cost=50
