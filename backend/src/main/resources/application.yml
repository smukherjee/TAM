spring:
  application:
    name: utam-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

---
# Local Development Profile (without Docker)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/utam
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: utam-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: localhost
      port: 6379

# Simulation Configuration
simulation:
  adsb-url: http://localhost:8092/adsb-ingest
  vehicle-url: http://localhost:8093/vehicle-ingest
  cv-url: http://localhost:8094/cv-event-ingest

# MinIO Configuration
minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket:
    raw-data: tam-raw-data
    processed-data: tam-processed-data
    reports: tam-reports

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

---
# Docker Profile (for docker-compose.dev.yml)
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://timescaledb:5432/utam}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda:29092}
    consumer:
      group-id: utam-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

# Simulation Configuration
simulation:
  adsb-url: ${SIMULATION_ADSB_URL:http://tam-nifi:8092/adsb-ingest}
  vehicle-url: ${SIMULATION_VEHICLE_URL:http://tam-nifi:8093/vehicle-ingest}
  cv-url: ${SIMULATION_CV_URL:http://tam-nifi:8094/cv-event-ingest}

# MinIO Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket:
    raw-data: tam-raw-data
    processed-data: tam-processed-data
    reports: tam-reports

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

# Monitoring and Observability Configuration
monitoring:
  health:
    green-threshold-seconds: 60
    amber-threshold-seconds: 120
  metrics:
    enable-latency: true
    enable-error-tracking: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
    com.utam: DEBUG
