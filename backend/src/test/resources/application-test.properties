# Test Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable schema initialization scripts for tests
spring.sql.init.mode=never

# Simulation endpoint placeholders required for Spring context tests
simulation.vehicle-url=http://localhost:8081/mock/vehicle
simulation.adsb-url=http://localhost:8081/mock/adsb
simulation.cv-url=http://localhost:8081/mock/cv

# Kafka placeholders for context-loading tests
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=test-group
spring.kafka.listener.auto-startup=false

# MinIO placeholders for context-loading tests
minio.endpoint=http://localhost:9000
minio.access-key=test-access-key
minio.secret-key=test-secret-key

# Use local in-memory cache for tests to avoid Redis dependency
spring.cache.type=simple
