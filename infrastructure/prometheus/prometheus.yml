# Prometheus Configuration for TAM Platform Dev
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Backend
  - job_name: 'tam-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['backend:8080']

  # Redpanda (Kafka)
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  # TimescaleDB (via postgres_exporter if added)
  # - job_name: 'timescaledb'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']

  # MinIO
  - job_name: 'minio'
    metrics_path: '/minio/v2/metrics/cluster'
    scheme: http
    static_configs:
      - targets: ['minio:9000']

  # Redis (via redis_exporter if added)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']

  # ksqlDB
  - job_name: 'ksqldb'
    static_configs:
      - targets: ['ksqldb-server:8088']
